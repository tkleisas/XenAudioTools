name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Release)
    runs-on: ubuntu-24.04
    # Build in 22.04 so the VST3/app keep a glibc 2.35 floor instead of
    # inheriting the 24.04 runner's 2.39 floor.
    container: ubuntu:22.04
    steps:
      # The bare ubuntu:22.04 image has no git; install it before checkout.
      - name: Bootstrap git
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates python3 python3-pip ninja-build ccache zip pkg-config g++ \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libx11-xcb-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev libgl1-mesa-dev \
            libcurl4-openssl-dev
          python3 -m pip install --no-cache-dir "cmake>=3.24,<4"
          cmake --version | head -1

      - name: Cache JUCE 7.0.12
        id: juce
        uses: actions/cache@v5
        with:
          path: juce-src
          key: juce-7.0.12-Linux

      - name: Fetch JUCE 7.0.12
        if: steps.juce.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git "$GITHUB_WORKSPACE/juce-src"

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: linux-ccache-${{ github.sha }}
          restore-keys: linux-ccache-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DXEN_JUCE_DIR="$GITHUB_WORKSPACE/juce-src"

      - name: Build
        # JUCE unity TUs are large; --parallel 2 keeps the 16 GB runner
        # comfortably below its memory ceiling (same lesson as YAWN/VWave).
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Validate VST3 bundle
        run: ./build/vst3/juce_vst3_helper -validate -path "build/vst3/XenakisUPIC_artefacts/Release/VST3/Xenakis UPIC.vst3"

      - name: Package smoke test
        run: ./scripts/package_release.sh build 0.0.0 dist

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache JUCE 7.0.12
        id: juce
        uses: actions/cache@v5
        with:
          path: juce-src
          key: juce-7.0.12-Windows

      - name: Fetch JUCE 7.0.12
        if: steps.juce.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git "$env:GITHUB_WORKSPACE\juce-src"

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          "-DXEN_VERSION=0.0.0"
          "-DXEN_JUCE_DIR=$env:GITHUB_WORKSPACE\juce-src"

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate VST3 bundle
        run: |
          $helper = Get-ChildItem -Recurse -Filter juce_vst3_helper.exe build | Select-Object -First 1
          if (-not $helper) { throw "juce_vst3_helper.exe not found" }
          & $helper.FullName -validate -path "build/vst3/XenakisUPIC_artefacts/Release/VST3/Xenakis UPIC.vst3"

      - name: Package smoke test
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package_release.ps1 -BuildDir build -Version 0.0.0 -OutDir dist

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache JUCE 7.0.12
        id: juce
        uses: actions/cache@v5
        with:
          path: juce-src
          key: juce-7.0.12-macOS

      - name: Fetch JUCE 7.0.12
        if: steps.juce.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git "$GITHUB_WORKSPACE/juce-src"

      - name: Patch JUCE for the macOS 15+ SDK
        run: |
          cd "$GITHUB_WORKSPACE/juce-src"
          if grep -q "JUCE_MACOS15_SNAPSHOT_GUARD" modules/juce_gui_basics/native/juce_Windowing_mac.mm; then
            echo "JUCE patch already applied"
          else
            git apply --ignore-whitespace "$GITHUB_WORKSPACE/patches/juce-7.0.12-macos15-sdk.patch"
          fi

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DXEN_VERSION=0.0.0 \
            -DXEN_JUCE_DIR="$GITHUB_WORKSPACE/juce-src"

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Validate VST3 bundle
        run: ./build/vst3/juce_vst3_helper -validate -path "build/vst3/XenakisUPIC_artefacts/Release/VST3/Xenakis UPIC.vst3"

      - name: Package smoke test
        run: PLATFORM=macos-universal ./scripts/package_release.sh build 0.0.0 dist

  android:
    name: Android (debug APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, NDK, and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install             "platforms;android-36"             "build-tools;36.1.0"             "ndk;27.2.12479018"             "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: upic-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  sanitizers:
    name: Sanitizers (core library)
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DXEN_BUILD_VST3=OFF \
            -DXEN_BUILD_APP=OFF \
            -DXEN_BUILD_TOOLS=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan --parallel 2

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure
