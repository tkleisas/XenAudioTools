name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version name without leading v (blank = version.properties)"
        required: false
      version_code:
        description: "Play versionCode (blank = version.properties)"
        required: false
      track:
        description: "Google Play track"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      release_status:
        description: "Play release status"
        type: choice
        options: [draft, completed]
        default: draft
      publish:
        description: "Publish the signed AAB to Google Play"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Signed Android App Bundle
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform, NDK, and CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.1.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            DEFAULT_NAME="${GITHUB_REF_NAME#v}"
          else
            DEFAULT_NAME="$(grep -E '^versionName=' android/version.properties | cut -d= -f2)"
          fi
          NAME="${{ github.event.inputs.version }}"
          CODE="${{ github.event.inputs.version_code }}"
          [[ -z "$NAME" ]] && NAME="$DEFAULT_NAME"
          [[ -z "$CODE" ]] && CODE="$(grep -E '^versionCode=' android/version.properties | cut -d= -f2)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building UPIC Studio $NAME ($CODE)"

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/upic/upload-keystore.jks"
          install -d -m 700 "$(dirname "$KEYSTORE")"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-release-gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-release-gradle-

      - name: Build signed AAB and APK
        working-directory: android
        env:
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon
          "$JAVA_HOME/bin/jarsigner" -verify app/build/outputs/bundle/release/app-release.aab
          BT="$ANDROID_HOME/build-tools/36.1.0"
          "$BT/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk >/dev/null
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v5
        with:
          name: upic-studio-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  publish:
    name: Publish to Google Play
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    environment: play-store
    steps:
      - name: Download signed AAB
        uses: actions/download-artifact@v5
        with:
          pattern: upic-studio-*
          path: artifacts
          merge-multiple: true

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: gr.tkleisas.upicstudio
          releaseFiles: artifacts/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.release_status }}
          changesNotSentForReview: false
