apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def versionPropertiesFile = rootProject.file('version.properties')
def versionProperties = new Properties()
if (versionPropertiesFile.exists()) {
    versionPropertiesFile.withInputStream { versionProperties.load(it) }
}
def resolvedVersionCode = (
        System.getenv('ANDROID_VERSION_CODE')
                ?: versionProperties.getProperty('versionCode', '1')).toInteger()
def resolvedVersionName = System.getenv('ANDROID_VERSION_NAME')
        ?: versionProperties.getProperty('versionName', '0.1.0')

def keystorePropertiesFile = rootProject.file('keystore.properties')
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile =
            new File(System.getProperty('user.home'), '.upicstudio/keystore.properties')
}
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String environmentName, String propertyName ->
    return System.getenv(environmentName) ?: keystoreProperties.getProperty(propertyName)
}
def releaseStorePath = signingValue('ANDROID_KEYSTORE_PATH', 'storeFile')

android {
    namespace 'gr.tkleisas.upicstudio'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'gr.tkleisas.upicstudio'
        minSdk 29
        targetSdk 36
        versionCode resolvedVersionCode
        versionName resolvedVersionName

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-O3'
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig false
    }

    signingConfigs {
        release {
            if (releaseStorePath) {
                storeFile file(releaseStorePath)
                storePassword signingValue('ANDROID_KEYSTORE_PASSWORD',
                        'storePassword')
                keyAlias signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            if (releaseStorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.compose.ui:ui:1.7.6'
    implementation 'androidx.compose.ui:ui-graphics:1.7.6'
    implementation 'androidx.compose.foundation:foundation:1.7.6'
    implementation 'androidx.compose.material3:material3:1.3.1'
}
